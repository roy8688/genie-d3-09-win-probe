name: D3-11 PTY + native GUI gates

on:
  workflow_dispatch:

jobs:
  pty:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PTY e2e
        run: node tests/fixtures/d3-11-pty-e2e.js
      - name: Native dialog / GUI e2e (Linux Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb zenity xdotool imagemagick scrot
          xvfb-run -a -s '-screen 0 1280x1024x24' node tests/fixtures/d3-11-native-gui-e2e.js
      - name: Native dialog / GUI e2e (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: node tests/fixtures/d3-11-native-gui-e2e.js

      - name: Native dialog / GUI e2e (Windows)
        if: runner.os == 'Windows'
        run: node tests/fixtures/d3-11-native-gui-e2e.js
