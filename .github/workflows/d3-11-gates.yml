name: D3-11 PTY + native GUI gates

on:
  workflow_dispatch:

jobs:
  pty:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ConPTY input debug (Windows)
        if: runner.os == 'Windows'
        run: |
          node tests/fixtures/d3-11-conpty-debug.js cmd.exe
          node tests/fixtures/d3-11-conpty-debug.js pwsh.exe
          node tests/fixtures/d3-11-conpty-console-probe.js pwsh.exe
      - name: PTY e2e
        run: node tests/fixtures/d3-11-pty-e2e.js
