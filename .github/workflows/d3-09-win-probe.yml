name: D3-09 Windows probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run D3-09 probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output "PROBE_START"
          & "$PWD\probe\d3-09-win-probe.ps1"
          Write-Output "PROBE_END exit=$LASTEXITCODE"
